[project]
name = "callmind-backend"
version = "0.1.0"
description = "CallMind backend (FastAPI). Replaces the Next.js server code step by step; the Next.js app stays as the web UI."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  # Unicode property classes (\p{L}) used by the ported JavaScript regexes.
  "regex>=2024.4",
  # Outside services (Gemini, OpenAI, Ollama, TTS, STT, Speko, GAPI): one shared async client.
  "httpx>=0.27",
  # Claude, through the official SDK.
  "anthropic>=2.0",
  # Audio decoding and resampling for the STT engines.
  "numpy>=1.26",
  # Multipart form bodies (Playground turns, live speech pieces) — FastAPI's Form/File need it.
  "python-multipart>=0.0.9",
  # Time zones (the loan calendar): Linux has them built in, Windows Python does not.
  "tzdata; sys_platform == 'win32'",
  # Knowledge-base uploads. PDF: pdfminer.six parses the file, app/rag/pdf_text.py lays the text out the
  # way pdf.js (unpdf) did. Word: mammoth, the Python port of the JavaScript library the site used.
  "pdfminer.six>=20260107",
  "mammoth>=1.13",
  # WHATWG URL parsing (Ada — the parser inside Node's `new URL`), for imported web pages.
  "ada-url>=1.27",
]

[project.optional-dependencies]
# Zipformer, the in-process streaming Uzbek STT (models/uzbek-zipformer). Without it only that engine is missing.
zipformer = [
  "sherpa-onnx>=2.0",
]
dev = [
  "pytest>=8",
  "ruff>=0.5",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
# pdf.js's encoding and glyph tables (app/rag/pdf_text.py), copied by tools/pdfjs-tables.cjs.
app = ["rag/pdfjs_tables.json"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.isort]
# backend/alembic/ (migrations) is not the alembic package.
known-third-party = ["alembic"]
known-first-party = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
