  # ── BRB-TECH ──────────────────────────────────────────────────────────
  brbtech:
    name: BRB-TECH
    source: brbtech_api
    base_url: https://brb-tech.uz
    api_base: https://brb-tech.uz/api-client
    # language code in our records → code the API and the site use (Uzbek only, as brb.uz)
    languages: {uz: uz}
    # The site's public pages per language. The home page holds "about",
    # services, the work process and the team; the rest comes from the API.
    html_pages: {uz: /}
    html:
      main_selector: div.min-h-screen
      drop_selectors: [header, nav, footer, form, "[class*=modal]"]
      drop_lines: [Batafsil, Подробнее, "Read more", "Learn more"]
      title_suffixes: []
    exclude: []
    news:
      patterns: []
      max_age_days: 0                 # 0 = keep all (the site has few news items)
    groups: {}
    default_group: brbtech

  # ── BRB exchange rates (every 15 minutes) ─────────────────────────────
  # The "Valyutalar kursi" page fills its table with JavaScript from this JSON endpoint, so the HTML has
  # no figures. We read the same endpoint and publish one page per rate type. Own job:
  #   python -m brb_scraper run --site brb_rates     (deploy/brb-scraper-rates.timer)
  brb_rates:
    name: "BRB bank — valyuta kurslari"
    source: currency_api
    base_url: https://brb.uz
    api_path: /api/currency/compare
    page_url: https://brb.uz/valyutalar-kursi       # what people see; each record is <page_url>#<type>
    rate_types:                                     # ?type=…  →  who the rates are for (Uzbek, as on the page)
      jismoniy: jismoniy shaxslar
      yuridik: yuridik shaxslar
    # brb.uz robots.txt closes /api to bots. BRB-TECH, which runs the site, approved reading this one
    # endpoint on 2026-11-24. Ask the web team to add `Allow: /api/currency/compare` to robots.txt,
    # then delete this line.
    robots_allow: [https://brb.uz/api/currency/compare]
    exclude: []
    news:
      patterns: []
      max_age_days: 0
    groups: {}
    default_group: currency
