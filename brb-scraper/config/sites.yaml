        - ""                          # the home page (brb.uz opens on business banking)
    # Pages that no URL rule matched are tried by their breadcrumb text.
    breadcrumb_groups:
      personal_loans: [kredit, ipoteka, кредит, ипотек, loan, mortgage]
      personal_cards: [karta, карт, card]
      personal_deposits: [omonat, вклад, deposit]
